name: Build Android App (AAB & APK)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode (must be strictly higher than previous release for in-place updates)'
        required: false
        default: ''
      version_name:
        description: 'Android versionName (e.g., 1.1.0)'
        required: false
        default: ''
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  actions: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build Android App Bundle & APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reclaim Artifact Quota (Early Cleanup of Old Artifacts)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });

              const otherArtifacts = artifacts.filter(
                (a) => !a.workflow_run || Number(a.workflow_run.id) !== Number(context.runId)
              );

              const totalBytes = otherArtifacts.reduce((sum, a) => sum + (a.size_in_bytes || 0), 0);
              core.info(`Found ${otherArtifacts.length} existing artifact(s) using ${(totalBytes / (1024 * 1024)).toFixed(2)} MB.`);

              // Sort newest first; keep at most the newest 2 artifacts (1 run) only if total < 100 MB,
              // otherwise purge all prior artifacts early so GitHub refreshes storage quota before upload.
              otherArtifacts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              const toDelete = totalBytes > 100 * 1024 * 1024 ? otherArtifacts : otherArtifacts.slice(2);

              for (const artifact of toDelete) {
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id,
                  });
                  core.info(`Deleted old artifact "${artifact.name}" (id=${artifact.id}, ${(artifact.size_in_bytes / (1024 * 1024)).toFixed(2)} MB)`);
                } catch (err) {
                  core.warning(`Failed to delete artifact ${artifact.id}: ${err.message}`);
                }
              }
            } catch (err) {
              core.warning(`Early artifact cleanup notice: ${err.message}`);
            }

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'cmdline-tools;latest platform-tools platforms;android-36 platforms;android-35 build-tools;36.0.0 build-tools;35.0.0'

      - name: Accept Android SDK Licenses & Verify SDK Platform 36
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          SDKMANAGER_BIN=""
          if command -v sdkmanager &> /dev/null; then
            SDKMANAGER_BIN="sdkmanager"
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -n "$SDKMANAGER_BIN" ]; then
            yes | "$SDKMANAGER_BIN" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER_BIN" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi

          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            echo "::error::Android SDK Platform 36 (android.jar) not found!"
            ls -la "$ANDROID_HOME/platforms" || true
            exit 1
          fi
          echo "Verified Android SDK Platform 36 at $ANDROID_HOME/platforms/android-36/android.jar"

      - name: Configure Android SDK Local Properties
        run: |
          mkdir -p android
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Node.js dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi

      - name: Resolve Monotonic Android Version Metadata
        env:
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE_VC=1
          BASE_VN="1.0"
          if [ -f "android/version.properties" ]; then
            PROP_VC=$(grep -E '^VERSION_CODE=' android/version.properties | head -n 1 | cut -d'=' -f2- | tr -d '[:space:]')
            PROP_VN=$(grep -E '^VERSION_NAME=' android/version.properties | head -n 1 | cut -d'=' -f2- | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            if [[ "$PROP_VC" =~ ^[0-9]+$ ]] && [ "$PROP_VC" -gt 0 ]; then
              BASE_VC="$PROP_VC"
            fi
            if [ -n "$PROP_VN" ]; then
              BASE_VN="$PROP_VN"
            fi
          fi

          CLEAN_INPUT_VC=$(printf '%s' "${INPUT_VERSION_CODE:-}" | tr -d '[:space:]')
          if [ -n "$CLEAN_INPUT_VC" ]; then
            if ! [[ "$CLEAN_INPUT_VC" =~ ^[0-9]+$ ]] || [ "$CLEAN_INPUT_VC" -lt 1 ]; then
              echo "::error::Invalid version_code input '$CLEAN_INPUT_VC'. Must be a positive integer."
              exit 1
            fi
            if [ "$CLEAN_INPUT_VC" -lt "$BASE_VC" ]; then
              echo "::error::Provided version_code ($CLEAN_INPUT_VC) is lower than base VERSION_CODE ($BASE_VC) in android/version.properties. Downgrading causes 'package conflicts with an existing package'."
              exit 1
            fi
            FINAL_VC="$CLEAN_INPUT_VC"
          else
            # Monotonically increase versionCode per CI run so automatic builds never downgrade
            FINAL_VC=$(( BASE_VC + RUN_NUMBER - 1 ))
          fi

          CLEAN_INPUT_VN=$(printf '%s' "${INPUT_VERSION_NAME:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          FINAL_VN="${CLEAN_INPUT_VN:-$BASE_VN}"

          echo "ANDROID_VERSION_CODE=$FINAL_VC" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=$FINAL_VN" >> "$GITHUB_ENV"
          echo "Resolved Android version: versionCode=$FINAL_VC, versionName=$FINAL_VN (base=$BASE_VC, run_number=$RUN_NUMBER)"

      - name: Build Web Application
        run: |
          rm -rf dist
          npm run build
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "::error::Web build failed to generate dist/index.html!"
            exit 1
          fi

      - name: Configure Google Services & Sync Capacitor
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo "Creating android/app/google-services.json fallback..."
            cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "589909705354",
              "project_id": "avian-gate-pbcxw",
              "storage_bucket": "avian-gate-pbcxw.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:589909705354:android:3d9e372d5712e34ed0e373",
                  "android_client_info": {
                    "package_name": "org.alnasr.bloodqatabah"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "589909705354-kupi11ci2s11photd5srrul4mv9rhcaf.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyCLtHs6SO9brCt3hMpq5di6XQdeO02i4rQ"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          npx cap sync android

      - name: Clean Stale Android Build Outputs & Verify Gradlew
        working-directory: android
        run: |
          chmod +x gradlew
          rm -rf app/build/outputs ../build-artifacts
          ./gradlew --version

      - name: Setup Release Keystore or Prepare Debug Mode
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          EFFECTIVE_KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$EFFECTIVE_KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/release.keystore
            if [ ! -s android/app/release.keystore ]; then
              echo "::error::Decoded release.keystore is empty or invalid base64!"
              rm -f android/app/release.keystore
              exit 1
            fi

            if ! keytool -list -keystore android/app/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "::error::Failed to verify release.keystore with provided KEYSTORE_PASSWORD and KEY_ALIAS!"
              rm -f android/app/release.keystore
              exit 1
            fi

            CERT_SHA256=$(keytool -list -v -keystore android/app/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | grep -i "SHA256:" | head -n 1 | sed 's/.*SHA256:[[:space:]]*//')
            echo "ANDROID_KEYSTORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$EFFECTIVE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=release" >> "$GITHUB_ENV"
            echo "SIGNING_CERT_SHA256=${CERT_SHA256}" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
            echo "Production release keystore verified successfully (Cert SHA-256: ${CERT_SHA256})."
          else
            echo "::warning::Release keystore secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS) are missing or incomplete. Skipping signed release bundle/APK build. Building debug APK successfully. To produce release updates, configure your original release keystore in GitHub Secrets."
            echo "SIGNING_MODE=debug" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_KEY=false" >> "$GITHUB_ENV"
          fi

      - name: Build Android AAB & APK
        working-directory: android
        run: |
          if [ "${HAS_RELEASE_KEY}" = "true" ]; then
            ./gradlew bundleRelease assembleRelease assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify Signature & Stage Deliverables
        run: |
          rm -rf build-artifacts
          mkdir -p build-artifacts/apk build-artifacts/aab

          if [ "${HAS_RELEASE_KEY}" = "true" ]; then
            AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" -type f | head -n 1)
            if [ -n "$AAB_FILE" ] && [ -s "$AAB_FILE" ]; then
              cp "$AAB_FILE" build-artifacts/aab/blood-qatabah-release.aab
            fi

            RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" ! -name "*-unsigned.apk" -type f | head -n 1)
            if [ -n "$RELEASE_APK" ] && [ -s "$RELEASE_APK" ]; then
              cp "$RELEASE_APK" build-artifacts/apk/blood-qatabah-release.apk
            fi
          else
            DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
            if [ -n "$DEBUG_APK" ] && [ -s "$DEBUG_APK" ]; then
              cp "$DEBUG_APK" build-artifacts/apk/blood-qatabah-debug.apk
              echo "Built debug APK successfully (signing mode: debug)."
            fi
          fi

          TARGET_APK=""
          if [ "${HAS_RELEASE_KEY}" = "true" ] && [ -f "build-artifacts/apk/blood-qatabah-release.apk" ]; then
            TARGET_APK="build-artifacts/apk/blood-qatabah-release.apk"
          elif [ -f "build-artifacts/apk/blood-qatabah-debug.apk" ]; then
            TARGET_APK="build-artifacts/apk/blood-qatabah-debug.apk"
          fi

          if [ -n "$TARGET_APK" ] && [ -f "$TARGET_APK" ]; then
            APK_SHA256=$(sha256sum "$TARGET_APK" | awk '{print $1}')
            APK_SIZE=$(stat -c%s "$TARGET_APK")
          else
            APK_SHA256="unknown"
            APK_SIZE=0
          fi

          RAW_VC=$(printf '%s' "${ANDROID_VERSION_CODE:-}" | tr -d '[:space:]')
          if [[ "$RAW_VC" =~ ^[0-9]+$ ]] && [ "$RAW_VC" -gt 0 ]; then
            VERSION_CODE="$RAW_VC"
          else
            VERSION_CODE="1"
          fi
          RAW_VN=$(printf '%s' "${ANDROID_VERSION_NAME:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          VERSION_NAME="${RAW_VN:-1.0}"

          cat << EOF > build-artifacts/apk/update-manifest.json
          {
            "packageName": "org.alnasr.bloodqatabah",
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "sha256": "${APK_SHA256}",
            "signingMode": "${SIGNING_MODE:-unknown}",
            "signingCertSha256": "${APK_CERT_SHA256:-unknown}",
            "fileSize": ${APK_SIZE},
            "minSdkVersion": 24,
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          echo "=========================================="
          echo "Verified Deliverables (In-Place Update Ready):"
          echo "Package Name      : org.alnasr.bloodqatabah"
          echo "Version Code      : ${VERSION_CODE}"
          echo "Version Name      : ${VERSION_NAME}"
          echo "Signing Mode      : ${SIGNING_MODE:-unknown}"
          echo "Cert SHA-256      : ${APK_CERT_SHA256:-unknown}"
          echo "APK SHA-256       : ${APK_SHA256}"
          echo "APK Size          : ${APK_SIZE} bytes"
          [ -f "build-artifacts/apk/blood-qatabah-release.apk" ] && ls -lh build-artifacts/apk/blood-qatabah-release.apk || true
          [ -f "build-artifacts/apk/blood-qatabah-debug.apk" ] && ls -lh build-artifacts/apk/blood-qatabah-debug.apk || true
          [ -f "build-artifacts/aab/blood-qatabah-release.aab" ] && ls -lh build-artifacts/aab/blood-qatabah-release.aab || true
          echo "=========================================="

      - name: Purge Previous Artifacts Before Upload
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });

              for (const artifact of artifacts) {
                if (artifact.workflow_run && Number(artifact.workflow_run.id) === Number(context.runId)) {
                  continue;
                }
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id,
                  });
                  core.info(`Purged prior artifact "${artifact.name}" (id=${artifact.id})`);
                } catch (err) {
                  core.warning(`Could not purge artifact ${artifact.id}: ${err.message}`);
                }
              }
            } catch (err) {
              core.warning(`Pre-upload artifact purge notice: ${err.message}`);
            }

      - name: Upload Android APK Artifact (Directly Installable)
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build-artifacts/apk/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
          overwrite: true

      - name: Upload Android AAB Artifact (Google Play Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: Android-AAB
          path: build-artifacts/aab/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9
          overwrite: true

      - name: Cleanup Temporary Signing & Build Files
        if: always()
        run: |
          rm -f android/app/release.keystore
          rm -rf build-artifacts
